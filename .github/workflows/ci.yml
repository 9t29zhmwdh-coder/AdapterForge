# All actions are pinned to a commit SHA per engineering-standards/standards/ci-cd.md
# section 2; the trailing comment is the human-readable version. Keep pins current
# via Dependabot's github-actions ecosystem updates (.github/dependabot.yml).

name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, format, test, build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Every package comes from requirements/ci.txt with its hash checked;
      # AdapterForge itself is installed without resolving anything further.
      - name: Install pinned dependencies and tools
        run: |
          pip install --require-hashes -r requirements/ci.txt
          pip install --no-deps --no-build-isolation -e .
      - name: Lock files match pyproject.toml
        run: |
          cp requirements/ci.txt fresh-ci.txt
          uv pip compile pyproject.toml requirements/tools.in --extra dev --universal --python-version 3.10 --generate-hashes -q --custom-compile-command "uv pip compile pyproject.toml requirements/tools.in --extra dev --universal --python-version 3.10 --generate-hashes -o requirements/ci.txt" -o fresh-ci.txt
          diff requirements/ci.txt fresh-ci.txt
          cp requirements/runtime.txt fresh-runtime.txt
          uv pip compile pyproject.toml --universal --python-version 3.10 --generate-hashes -q --custom-compile-command "uv pip compile pyproject.toml --universal --python-version 3.10 --generate-hashes -o requirements/runtime.txt" -o fresh-runtime.txt
          diff requirements/runtime.txt fresh-runtime.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest tests/ -v --cov=src --cov-report=term-missing
      - name: Build wheel and sdist
        run: python -m build --no-isolation

  security-scan:
    name: Security audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Every package comes from requirements/ci.txt with its hash checked;
      # AdapterForge itself is installed without resolving anything further.
      - name: Install pinned dependencies and tools
        run: |
          pip install --require-hashes -r requirements/ci.txt
          pip install --no-deps --no-build-isolation -e .
      - name: pip-audit
        run: pip-audit --skip-editable

  sbom:
    name: Generate SBOM
    needs: [lint-and-test, security-scan]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned tools
        run: pip install --require-hashes -r requirements/ci.txt
      # The SBOM lists what AdapterForge needs at runtime, from the hashed
      # runtime lock, rather than everything the CI environment holds.
      - name: Generate SBOM
        run: cyclonedx-py requirements --pyproject pyproject.toml -o bom.json requirements/runtime.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: bom.json
          retention-days: 90

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-and-test, security-scan, sbom]
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
      - name: Attest SBOM provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bom.json
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: CHANGELOG.md
          files: bom.json
