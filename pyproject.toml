[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adapterforge"
version = "0.1.8"
description = "Local QLoRA adapter training pipeline for Ollama models on Apple Silicon"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rafael Yilmaz" }]
dependencies = [
    "mlx-lm>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    # Pinned exactly: an open range lets a new ruff reformat the same
    # unchanged source and turn CI red without a commit, which is what
    # happened with 0.16.0's import ordering. Dependabot's pip ecosystem
    # bumps this as a reviewable PR.
    "ruff==0.16.0",
]

[project.scripts]
adapterforge = "adapterforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
